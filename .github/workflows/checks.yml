name: Checks

# Plugin validation and the package checks, Markdown lint, formatting and
# secret scanning. The pull request title is checked in pr-title.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    name: Plugin validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install the pinned Claude Code binary (lifecycle scripts disabled)
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @anthropic-ai/claude-code-linux-x64@2.1.283
      - name: Validate the marketplace
        run: ./node_modules/@anthropic-ai/claude-code-linux-x64/claude plugin validate --strict .
      - name: Validate the Claude plugin
        run: ./node_modules/@anthropic-ai/claude-code-linux-x64/claude plugin validate --strict claude/plugins/oak-national-academy
      - name: Check the README, CHANGELOG and marketplace entries against the packages
        run: python3 scripts/check_against_plugin.py
      - name: Check the ChatGPT package's skills are exact copies of the Claude plugin's
        run: python3 scripts/check_skill_copies.py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the pinned packages the package checks need
        run: |
          python -m pip install --require-hashes --no-deps --only-binary :all: -r scripts/requirements.txt
      - name: Check the rules both packages follow
        run: python scripts/check_packages.py
      - name: Build the ChatGPT upload ZIP
        run: python3 scripts/build_chatgpt_zip.py --out "$RUNNER_TEMP/chatgpt.zip"

  lint-and-format:
    name: Markdown lint + Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install pinned lint tools (lifecycle scripts disabled)
        run: npm install --no-save --ignore-scripts --no-audit --no-fund markdownlint-cli2@0.23.2 prettier@3.9.6
      - name: markdownlint
        run: ./node_modules/.bin/markdownlint-cli2
      - name: Prettier (check)
        run: ./node_modules/.bin/prettier --check "**/*.{md,json,yaml,yml}"

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so a secret added in one commit and deleted in a
          # later one is still found.
          fetch-depth: 0
      - name: Run gitleaks
        # --proto '=https' keeps every hop on HTTPS; the archive is checked
        # against the release's published sha256 before it runs.
        run: |
          VERSION=8.30.1
          SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSL --proto '=https' --tlsv1.2 \
            -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner -v .
