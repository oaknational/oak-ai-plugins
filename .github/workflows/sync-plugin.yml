name: Sync plugin from the ecosystem

# One-click publish: copies every package in PROVENANCE.json (the Claude
# plugin and the ChatGPT package) from oak-open-curriculum-ecosystem at the
# given ref, strips the excluded paths,
# rewrites PROVENANCE.json, stubs the root CHANGELOG entry, formats both and
# opens a pull request — so a publish cannot be done inconsistently by hand. The fidelity
# check runs here too, and again as a required check on the pull request.
#
# NOTE: pull requests created with the default GITHUB_TOKEN do not trigger
# other workflows, so the PR opens with no checks. Close and reopen it (or
# push an empty commit) to start them.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ecosystem ref to copy (tag, branch or SHA)'
        required: true
        default: 'main'
      release:
        description: 'Ecosystem release the ref belongs to (e.g. v1.185.3); recorded in PROVENANCE.json'
        required: false

permissions:
  contents: read

jobs:
  sync:
    name: Copy the packages and open a pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the sync branch
      pull-requests: write # open the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the ecosystem at the requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: oaknational/oak-open-curriculum-ecosystem
          ref: ${{ inputs.ref }}
          path: ecosystem
          persist-credentials: false

      - name: Copy the packages and update PROVENANCE.json + CHANGELOG.md
        run: |
          COMMIT=$(git -C ecosystem rev-parse HEAD)
          python3 scripts/sync_plugin.py --source ecosystem --commit "$COMMIT" \
            ${RELEASE:+--release "$RELEASE"}
          rm -rf ecosystem
          echo "COMMIT=$COMMIT" >> "$GITHUB_ENV"
        env:
          RELEASE: ${{ inputs.release }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Format PROVENANCE.json and CHANGELOG.md with the pinned Prettier
        # sync_plugin.py writes JSON with one array item per line; Prettier,
        # which the lint job checks, wants short arrays on one line.
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund prettier@3.9.6
          ./node_modules/.bin/prettier --write PROVENANCE.json CHANGELOG.md

      - name: Check the copy against its recorded source
        run: python3 scripts/check_provenance.py

      - name: Check the README, CHANGELOG and marketplace entries against the packages
        # Advisory here: a sync that adds or removes a skill, or changes the
        # manifest, legitimately leaves the repository-owned README and
        # marketplace entry behind. The pull request must still open so they
        # can be brought up to date on its branch; the same check is required
        # on the pull request, so it cannot merge stale.
        run: |
          if python3 scripts/check_against_plugin.py; then
            echo "DERIVED_STALE=" >> "$GITHUB_ENV"
          else
            echo "::warning::The README, CHANGELOG or marketplace entries no longer match the packages — update them on the sync branch before merge."
            echo "DERIVED_STALE=1" >> "$GITHUB_ENV"
          fi

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('claude/plugins/oak-national-academy/.claude-plugin/plugin.json'))['version'])")
          BRANCH="sync/plugin-${VERSION}-${COMMIT:0:9}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git diff --cached --quiet && { echo "Nothing changed; the copy already matches ${COMMIT:0:9}."; exit 0; }
          git commit -m "chore: publish the plugins ${VERSION} from the ecosystem at ${COMMIT:0:9}"
          git push origin "$BRANCH"
          BODY="Copies \`claude/plugins/oak-national-academy\` and \`chatgpt/plugins/oak-national-academy\` from oak-open-curriculum-ecosystem at ${COMMIT}${RELEASE:+ (release $RELEASE)}, without the excluded paths in PROVENANCE.json. Produced by the **Sync plugin from the ecosystem** workflow; the Sync fidelity check proves the copy."
          if [ -n "$DERIVED_STALE" ]; then
            BODY="$BODY$(printf '\n\n> [!WARNING]\n> The README, CHANGELOG or marketplace entries no longer match the packages — update them on this branch before merge.')"
          fi
          BODY="$BODY$(printf '\n\nChecks do not start on workflow-created pull requests: close and reopen this PR to run them.')"
          gh pr create \
            --title "chore: publish the plugins ${VERSION} from the ecosystem at ${COMMIT:0:9}" \
            --body "$BODY"
