name: Spec drift

# A weekly alarm for the plugin no longer validating against the LATEST
# Claude Code. Issues are off here by design, so a red run of this workflow is
# the signal. GitHub emails scheduled-run failures ONLY to whoever last
# edited the workflow file — keep that a maintainer, and re-save the file if
# that person leaves. A team channel notification can hang off the Oak
# Semantic Release Bot's token once that is set up (see the workflows
# README); until then the Actions tab badge is the shared view.
#
# Pull requests validate with a pinned binary so they stay deterministic;
# this job is the early warning that Anthropic's spec moved under us.

on:
  schedule:
    - cron: '30 7 * * 1' # Mondays 07:30 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec:
    name: Validate with the latest Claude Code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install today's Claude Code binary (lifecycle scripts disabled)
        # Unpinned by design: this job exists to hear about spec changes, so
        # it resolves whatever is current, names it in the log, and installs
        # that exact version. Pull requests keep the pinned binary.
        run: |
          LATEST=$(npm view @anthropic-ai/claude-code-linux-x64 version)
          echo "Validating with Claude Code ${LATEST}"
          npm install --no-save --ignore-scripts --no-audit --no-fund "@anthropic-ai/claude-code-linux-x64@${LATEST}"
      - name: Validate the marketplace and the plugin against today's spec
        run: |
          ./node_modules/@anthropic-ai/claude-code-linux-x64/claude --version
          ./node_modules/@anthropic-ai/claude-code-linux-x64/claude plugin validate --strict .
          ./node_modules/@anthropic-ai/claude-code-linux-x64/claude plugin validate --strict claude/plugins/oak-national-academy
